manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: joelspadin
      url-base: https://github.com/joelspadin
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
  projects:
    # ZMK itself: takes defaults.revision (v0.3). Must match the @v0.3 workflow in .github/workflows/build.yml.
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    # German (and other) locale key codes: #include <locale/keys_de.h> in the keymap.
    # The explicit revision is required: defaults.revision (v0.3) does not exist in this repo.
    - name: zmk-locales
      remote: joelspadin
      revision: main
    # nice!view custom status screen
    - name: nice-nice-oled
      remote: mctechnology17
      revision: main
  self:
    path: config
